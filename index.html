<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTM | Admin Command</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Enterprise Midnight Slate Theme */
        :root {
            --bg-dark: #090e17;
            --surface: #141b2d;
            --surface-hover: #1f2937;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #2a3441;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { margin: 0; background: var(--bg-dark); color: var(--text-main); padding-bottom: 80px; -webkit-font-smoothing: antialiased; }
        
        .hidden { display: none !important; }
        
        /* Layouts */
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        
        /* Typography */
        h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.3px; }
        .text-sm { font-size: 12px; color: var(--text-muted); }
        .text-xs { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Cards & Grid */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .dashboard-stat { background: var(--bg-dark); padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
        .dashboard-stat h2 { color: var(--primary); font-size: 26px; margin: 8px 0 0 0; }
        
        /* Forms */
        input, select { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text-main); font-size: 14px; margin-bottom: 12px; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: var(--primary); }
        
        /* Buttons */
        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px var(--primary-glow); }
        .btn-primary:active { transform: translateY(2px); box-shadow: none; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-danger-ghost { background: transparent; color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-sm { width: auto; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
        
        /* Status Badges */
        .badge { padding: 4px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .badge-success { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge-primary { background: rgba(59, 130, 246, 0.15); color: var(--primary); border: 1px solid rgba(59, 130, 246, 0.2); }
        
        /* List Items (Records) */
        .record-item { background: var(--bg-dark); border: 1px solid var(--border); padding: 16px; border-radius: 12px; margin-bottom: 12px; }
        .record-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .record-actions { display: flex; gap: 8px; margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px; }
        
        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20, 27, 45, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; padding: 10px 0 env(safe-area-inset-bottom) 0; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 11px; gap: 4px; cursor: pointer; transition: 0.3s; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-2px); }
        
        /* Toasts */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
        .toast { padding: 14px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); animation: slideDown 0.3s ease-out forwards; background: var(--surface); border: 1px solid var(--border); }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div class="container">
    
    <!-- LOGIN MODULE -->
    <div id="auth-module" class="hidden" style="margin-top: 15vh;">
        <div style="text-align: center; margin-bottom: 40px;">
            <i class="fas fa-crown text-primary" style="font-size: 48px; cursor: pointer; filter: drop-shadow(0 0 12px var(--primary-glow));" onclick="initAdminOverride()"></i>
            <h2 style="margin-top: 20px;">Hemant Team Workspace</h2>
            <p class="text-sm">Secure Identity Verification</p>
        </div>
        <div class="card">
            <input type="text" id="auth-id" placeholder="Member ID (e.g. HTM-01)">
            <input type="password" id="auth-pass" placeholder="Password">
            <button class="btn btn-primary" onclick="Auth.login()">Secure Sign In</button>
        </div>
    </div>

    <!-- ADMIN MODULE -->
    <div id="admin-module" class="hidden">
        <div class="app-header">
            <div>
                <h3>HQ Command</h3>
                <span class="badge badge-warning">God Mode Active</span>
            </div>
            <i class="fas fa-power-off text-muted" style="font-size: 20px; cursor: pointer;" onclick="Auth.logout()"></i>
        </div>

        <!-- 1. Radar Tab -->
        <div id="admin-radar" class="tab-content">
            <div class="grid-2" style="margin-bottom: 20px;">
                <div class="dashboard-stat">
                    <span class="text-xs">Total Network DD</span>
                    <h2 id="admin-dd-total" class="text-success">₹0</h2>
                </div>
                <div class="dashboard-stat">
                    <span class="text-xs">Live Agents</span>
                    <h2 id="admin-active-count">0</h2>
                </div>
            </div>
            
            <h4 style="margin-bottom: 12px;"><i class="fas fa-satellite-dish text-primary"></i> Active Operations</h4>
            <div id="admin-radar-container">
                <p class="text-sm text-muted" style="text-align: center;">Fetching telemetry...</p>
            </div>
        </div>

        <!-- 2. Team Tab (Unified Create & Manage) -->
        <div id="admin-team" class="tab-content hidden">
            <div class="card">
                <h4 style="margin-bottom: 16px;"><i class="fas fa-user-plus text-primary"></i> Onboard Member</h4>
                <div class="grid-2">
                    <input type="text" id="new-id" placeholder="ID (HTM-XX)">
                    <input type="text" id="new-name" placeholder="Full Name">
                </div>
                <input type="text" id="new-pass" placeholder="Assign Password">
                <button class="btn btn-primary" onclick="Admin.createUser()">Authorize Account</button>
            </div>
            
            <h4 style="margin-bottom: 12px;"><i class="fas fa-users text-primary"></i> Network Roster</h4>
            <div id="admin-team-container"></div>
        </div>

        <!-- 3. Sales/Vault Tab -->
        <div id="admin-sales" class="tab-content hidden">
            <h4 style="margin-bottom: 12px;"><i class="fas fa-vault text-primary"></i> Master Data Vault</h4>
            <div id="admin-sales-container"></div>
        </div>

        <!-- Admin Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="UI.switchTab('admin', 'radar', this)"><i class="fas fa-radar"></i>Overview</div>
            <div class="nav-item" onclick="UI.switchTab('admin', 'team', this)"><i class="fas fa-user-shield"></i>Team</div>
            <div class="nav-item" onclick="UI.switchTab('admin', 'sales', this)"><i class="fas fa-database"></i>Vault</div>
        </div>
    </div>

    <!-- MEMBER MODULE (Kept hidden for now, logic preserved) -->
    <div id="member-module" class="hidden">
        <h3 class="text-center" style="margin-top: 20vh;">Member Panel Restructure In Progress...</h3>
        <button class="btn btn-outline" style="margin-top: 20px;" onclick="Auth.logout()">Logout</button>
    </div>

</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAShdxZg9dn-t5_c5q8Kr_c0nsajkMRwU0",
        authDomain: "hemant-team-management.firebaseapp.com",
        projectId: "hemant-team-management",
        storageBucket: "hemant-team-management.firebasestorage.app",
        messagingSenderId: "975104255247",
        appId: "1:975104255247:web:46fcb19955ba3e4ac20a7a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    class UI {
        static showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle';
            toast.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        static switchTab(module, tabId, element) {
            document.querySelectorAll(`#${module}-module .tab-content`).forEach(el => el.classList.add('hidden'));
            element.parentElement.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`${module}-${tabId}`).classList.remove('hidden');
            element.classList.add('active');
        }
    }

    class Auth {
        static init() {
            const role = localStorage.getItem('htm_role');
            if (role === 'admin') {
                document.getElementById('admin-module').classList.remove('hidden');
                Admin.initData();
            } else if (role === 'member') {
                document.getElementById('member-module').classList.remove('hidden');
            } else {
                document.getElementById('auth-module').classList.remove('hidden');
            }
        }
        
        static logout() {
            localStorage.clear();
            window.location.reload();
        }
    }

    class Admin {
        static initData() {
            this.streamRadar();
            this.streamTeam();
            this.streamSales();
        }

        static async createUser() {
            const id = document.getElementById('new-id').value.trim();
            const name = document.getElementById('new-name').value.trim();
            const pass = document.getElementById('new-pass').value.trim();
            
            if(!id || !name || !pass) return UI.showToast('All fields are mandatory.', 'error');
            
            try {
                await db.collection('users').doc(id).set({ name, password: pass, deviceToken: "", active: true });
                UI.showToast(`Member ${id} added to roster.`);
                document.getElementById('new-id').value = ''; document.getElementById('new-name').value = ''; document.getElementById('new-pass').value = '';
            } catch (err) { UI.showToast('Database Error: Could not create user.', 'error'); }
        }

        // Radar Tab Operations
        static streamRadar() {
            db.collection('tracking').orderBy('timestamp', 'desc').onSnapshot(snap => {
                const container = document.getElementById('admin-radar-container');
                container.innerHTML = snap.empty ? '<p class="text-sm text-center">No active field data.</p>' : '';
                let activeCount = 0;

                snap.forEach(doc => {
                    const d = doc.data();
                    if(d.status === "Active") activeCount++;
                    const badge = d.status === "Active" ? `<span class="badge badge-warning"><i class="fas fa-circle fa-beat text-xs"></i> Active</span>` : `<span class="badge badge-success">Completed</span>`;
                    
                    container.innerHTML += `
                    <div class="record-item">
                        <div class="record-header">
                            <div>
                                <h4 style="margin-bottom:4px;">${d.memberName || 'Agent'} <span class="text-sm">(${d.memberId})</span></h4>
                                <span class="text-sm text-muted">Met: <strong style="color:var(--text-main);">${d.prospect}</strong> [${d.type}]</span>
                            </div>
                            <div>${badge}</div>
                        </div>
                        <div class="record-actions">
                            ${d.status === 'Active' ? `<button class="btn btn-outline btn-sm" onclick="Admin.forceEndTracking('${doc.id}')">Force End</button>` : ''}
                            <button class="btn btn-danger-ghost btn-sm" onclick="Admin.deleteRecord('tracking', '${doc.id}', 'Delete this log?')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
                });
                document.getElementById('admin-active-count').innerText = activeCount;
            }, err => { UI.showToast("Radar sync failed.", "error"); });
        }

        static async forceEndTracking(docId) {
            try {
                await db.collection('tracking').doc(docId).update({ status: "Completed (Forced)" });
                UI.showToast('Meeting forcibly ended.');
            } catch(e) { UI.showToast('Error ending meeting.', 'error'); }
        }

        // Team Tab Operations
        static streamTeam() {
            db.collection('users').onSnapshot(snap => {
                const container = document.getElementById('admin-team-container');
                container.innerHTML = snap.empty ? '<p class="text-sm text-center">No members found.</p>' : '';
                
                snap.forEach(doc => {
                    const d = doc.data();
                    const deviceStatus = d.deviceToken ? '<span class="badge badge-primary">Device Bound</span>' : '<span class="badge" style="background:#334155;color:#fff;">Unbound</span>';
                    
                    container.innerHTML += `
                    <div class="record-item">
                        <div class="record-header">
                            <div>
                                <h4 style="margin-bottom:4px;">${d.name} <span class="text-sm">(${doc.id})</span></h4>
                                <div style="margin-top: 6px;">${deviceStatus}</div>
                            </div>
                        </div>
                        <div class="record-actions">
                            <button class="btn btn-outline btn-sm" onclick="Admin.resetDevice('${doc.id}')"><i class="fas fa-unlock"></i> Reset Phone</button>
                            <button class="btn btn-danger-ghost btn-sm" onclick="Admin.deleteRecord('users', '${doc.id}', 'Permanently remove this member?')"><i class="fas fa-user-times"></i> Delete</button>
                        </div>
                    </div>`;
                });
            }, err => { UI.showToast("Team sync failed.", "error"); });
        }

        static async resetDevice(uid) {
            if(confirm(`Unbind current device lock for ${uid}?`)) {
                try {
                    await db.collection('users').doc(uid).update({ deviceToken: "" });
                    UI.showToast('Device lock removed.');
                } catch(e) { UI.showToast('Error resetting device.', 'error'); }
            }
        }

        // Vault/Sales Tab Operations
        static streamSales() {
            db.collection('leads').orderBy('timestamp', 'desc').onSnapshot(snap => {
                const container = document.getElementById('admin-sales-container');
                container.innerHTML = snap.empty ? '<p class="text-sm text-center">Vault is empty.</p>' : '';
                let totalDD = 0;

                snap.forEach(doc => {
                    const d = doc.data();
                    if(d.ddClosed) totalDD += d.ddAmount;
                    
                    const ddPill = d.ddClosed 
                        ? `<span class="badge badge-success">Closed: ₹${d.ddAmount}</span>` 
                        : `<span class="badge badge-warning">Pending</span>`;
                    
                    container.innerHTML += `
                    <div class="record-item">
                        <div class="record-header">
                            <div>
                                <h4 style="margin-bottom:4px;">${d.name}</h4>
                                <span class="text-sm text-muted">Agent: ${d.memberId} | Temp: ${d.temp}</span>
                            </div>
                            <div style="text-align:right;">${ddPill}</div>
                        </div>
                        <div class="record-actions">
                            ${d.ddClosed ? `<button class="btn btn-outline btn-sm" onclick="Admin.revokeDD('${doc.id}')"><i class="fas fa-undo"></i> Revoke DD</button>` : ''}
                            <button class="btn btn-danger-ghost btn-sm" onclick="Admin.deleteRecord('leads', '${doc.id}', 'Delete this prospect?')"><i class="fas fa-trash"></i> Drop Lead</button>
                        </div>
                    </div>`;
                });
                document.getElementById('admin-dd-total').innerText = '₹' + totalDD;
            }, err => { UI.showToast("Vault sync failed.", "error"); });
        }

        static async revokeDD(leadId) {
            if(confirm("Revoke DD and reset to pending?")) {
                try {
                    await db.collection('leads').doc(leadId).update({ ddClosed: false, ddAmount: 0 });
                    UI.showToast('DD Revoked.');
                } catch(e) { UI.showToast('Error revoking DD.', 'error'); }
            }
        }

        static async deleteRecord(collection, docId, msg) {
            if(confirm(msg)) {
                try {
                    await db.collection(collection).doc(docId).delete();
                    UI.showToast('Record purged permanently.');
                } catch(e) { UI.showToast('Error deleting record.', 'error'); }
            }
        }
    }

    function initAdminOverride() {
        const pass = prompt("Enter Master PIN:");
        if(pass === "9999") {
            localStorage.setItem('htm_role', 'admin');
            window.location.reload();
        }
    }

    Auth.init();
</script>
</body>
</html>
